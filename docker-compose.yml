services:
  echo-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo
      POSTGRES_DB: echotrade
    ports:
      - "${ECHO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  echo-core:
    build:
      context: .
      dockerfile: app/core/Dockerfile
    working_dir: /workspace
    command: uv run --package core uvicorn core.app:app --host 0.0.0.0 --port 8000 --reload
    env_file: [.env]
    environment:
      ECHO_DATABASE_URL: postgresql+asyncpg://echo:echo@echo-postgres:5432/echotrade
      ECHO_LENS_ARTIFACTS_DIR: /tmp/echotrade-lens
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    init: true
    shm_size: 128m
    ports:
      - "${ECHO_CORE_PORT:-8000}:8000"
    volumes:
      - .:/workspace
    depends_on: [echo-postgres]

  echo-mail:
    profiles: [mail]
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    hostname: ${ECHO_MAIL_HOSTNAME:-mail}
    domainname: ${ECHO_MAIL_DOMAIN:-oskarwichtowski.com}
    env_file: [./infra/mailserver/docker-mailserver.env]
    ports:
      - "${ECHO_MAIL_PORT_25:-25}:25"
      - "${ECHO_MAIL_PORT_587:-587}:587"
      - "${ECHO_MAIL_PORT_143:-143}:143"
      - "${ECHO_MAIL_PORT_993:-993}:993"
    volumes:
      - ./infra/mailserver/docker-data/dms/mail-data/:/var/mail/
      - ./infra/mailserver/docker-data/dms/mail-state/:/var/mail-state/
      - ./infra/mailserver/docker-data/dms/mail-logs/:/var/log/mail/
      - ./infra/mailserver/docker-data/dms/config/:/tmp/docker-mailserver/
    cap_add: [NET_ADMIN]
    restart: unless-stopped

volumes:
  pgdata:
