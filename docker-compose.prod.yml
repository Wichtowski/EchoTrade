# Fixed project name, so containers, volumes and networks are echotrade_* whatever the deploy directory is called
name: echotrade

services:
  echo-postgres:
    container_name: echotrade-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: postgres -c shared_buffers=64MB -c max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"
    networks:
      - data_net
    mem_limit: 256m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  echo-core:
    container_name: echotrade-core
    # Built and pushed by the deploy workflow; ECHO_APP_VERSION is the release tag
    image: ghcr.io/wichtowski/echotrade-core:${ECHO_APP_VERSION:?Set ECHO_APP_VERSION to the release tag}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ECHO_LENS_ARTIFACTS_DIR: /tmp/echotrade-lens
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    init: true
    shm_size: 128m
    command: /opt/venv/bin/uvicorn core.app:app --host 0.0.0.0 --port 8000
    depends_on:
      - echo-postgres
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - app_net
      - data_net
    mem_limit: 768m
    cpus: "1.0"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  echo-mail:
    container_name: echotrade-mail
    profiles: [mail]
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    hostname: ${ECHO_MAIL_HOSTNAME:-mail}
    domainname: ${ECHO_MAIL_DOMAIN:-oskarwichtowski.com}
    restart: unless-stopped
    env_file:
      - ./infra/mailserver/docker-mailserver.env
    ports:
      - "${ECHO_MAIL_PORT_25:-25}:25"
      - "${ECHO_MAIL_PORT_587:-587}:587"
      - "${ECHO_MAIL_PORT_143:-143}:143"
      - "${ECHO_MAIL_PORT_993:-993}:993"
    volumes:
      - mail_data:/var/mail/
      - mail_state:/var/mail-state/
      - mail_logs:/var/log/mail/
      - mail_config:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
    cap_add:
      - NET_ADMIN
    networks:
      - mail_net
      - app_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  mail_data:
  mail_state:
  mail_logs:
  mail_config:

networks:
  edge_net:
  app_net:
  data_net:
    internal: true
  mail_net:
