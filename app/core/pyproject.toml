[project]
name = "core"
version = "0.1.0"
description = "EchoTrade backend API — central orchestration service"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.111",
    "httpx>=0.27",
    "openai>=2.41",
    "exchange-calendars>=4.11",
    "uvicorn[standard]>=0.30",
    "libshared",
    "libdb",
    "lens",
    "guard",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
migration = ["pymongo>=4.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.uv.sources]
libshared = { workspace = true }
libdb     = { workspace = true }
