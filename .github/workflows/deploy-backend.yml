name: Deploy Backend

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # Push the release image to GHCR; the VPS pulls it with the same short-lived token
  packages: write

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      RELEASE_VERSION: ${{ github.ref_name }}
      IMAGE: ghcr.io/wichtowski/echotrade-core
      # Unique per run, so concurrent or retried deploys never share uploaded files
      RELEASE_DIR: /tmp/echotrade-release-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Build production env file
        run: |
          cat > .env.production <<'EOF'
          ${{ secrets.ENV_PRODUCTION }}
          EOF

          sed -i '/^ECHO_APP_VERSION=/d' .env.production
          printf '\nECHO_APP_VERSION=%s\n' "${RELEASE_VERSION}" >> .env.production

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Built once here, so the VPS only pulls and runs it and never needs the source.
      # .dockerignore keeps .env files out of the image; secrets come from the VPS .env at runtime.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/core/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy release files to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          # Only what the stack needs; the image holds the app
          source: "docker-compose.prod.yml,.env.production"
          target: ${{ env.RELEASE_DIR }}

      - name: Deploy stack on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          script_stop: true
          envs: DEPLOY_PATH,RELEASE_DIR,RELEASE_VERSION,IMAGE,GHCR_USER,GHCR_TOKEN
          command_timeout: "20m"
          script: |
            set -euo pipefail
            : "${DEPLOY_PATH:?}" "${RELEASE_DIR:?}"

            # The job token expires when the job ends; drop the stored login either way
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "${RELEASE_DIR}"' EXIT
            printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # Pull before touching the running stack, so a failed pull leaves it as it was
            docker pull "${IMAGE}:${RELEASE_VERSION}"

            mkdir -p "${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"

            if [ -f docker-compose.prod.yml ] && [ -f .env ]; then
              if docker compose --env-file .env -f docker-compose.prod.yml config --services | grep -qx 'echo-mongo'; then
                if ! docker compose --env-file .env -f docker-compose.prod.yml exec -T echo-postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT name FROM data_migrations WHERE name = '\''legacy_mongo'\''"' | grep -qx 'legacy_mongo'; then
                  echo "Legacy MongoDB migration is required. Stop old Core/worker, import captures and saved queries, then retry deployment."
                  exit 1
                fi
              fi
            fi

            # Keep only the release files, .env and infra/ (Postgres init script, mail server state);
            # earlier releases shipped the whole repository
            find . -mindepth 1 -maxdepth 1 ! -name '.env' ! -name 'infra' -exec rm -rf {} +
            mv "${RELEASE_DIR}/docker-compose.prod.yml" .
            mv "${RELEASE_DIR}/.env.production" .env
            chmod 600 .env

            # ensure mailserver env is present (written from secret)
            mkdir -p "${DEPLOY_PATH}/infra/mailserver"
            chmod 755 "${DEPLOY_PATH}/infra/mailserver"

            rm -f "${DEPLOY_PATH}/infra/mailserver/docker-mailserver.env"
            printf '%s\n' "${{ secrets.DOCKER_MAILSERVER_ENV }}" > "${DEPLOY_PATH}/infra/mailserver/docker-mailserver.env"
            chmod 600 "${DEPLOY_PATH}/infra/mailserver/docker-mailserver.env"

            mail_profile=()
            if grep -Eq "^ECHO_SMTP_HOST=[\"']?echo-mail[\"']?$" .env; then
              mail_profile=(--profile mail)
            fi
            # --remove-orphans drops containers of services that are no longer in the stack
            docker compose --env-file .env -f docker-compose.prod.yml "${mail_profile[@]}" up -d --remove-orphans
            docker compose --env-file .env -f docker-compose.prod.yml ps

            # Keep the deployed release plus the two newest older ones for rollback
            docker image ls "${IMAGE}" --format '{{.Tag}}' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -vxF "${RELEASE_VERSION}" \
              | sort -V \
              | head -n -2 \
              | while read -r old_tag; do
                  docker image rm "${IMAGE}:${old_tag}" || true
                done || true

            # Drop untagged layers of superseded releases
            docker image prune -f
