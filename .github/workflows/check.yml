name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: echotrade_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ECHO_TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@127.0.0.1:5432/echotrade_test
    steps:
      - uses: actions/checkout@v7
      - run: python -m pip install uv
      - run: uv sync --locked --python 3.12 --all-packages --extra dev --extra migration
      - run: uv run --all-packages --extra dev pytest app/core/tests app/lens/tests -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
        working-directory: app/dash
      - run: bun run lint && bun run build
        working-directory: app/dash
